<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">PixoPDF logo — dark theme</title>
  <desc id="desc">A stacked document symbol with a teal page split and amber folded corner, followed by the word pixoPDF on a dark background.</desc>

  <rect width="1200" height="360" rx="34" fill="#0F172A"/>

  <defs>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14B8A6" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g transform="translate(64 46)" filter="url(#softGlow)">
    <!-- Back page -->
    <rect x="30" y="16" width="196" height="238" rx="30" fill="#1E293B" stroke="#CBD5E1" stroke-width="10"/>
    <!-- Front page -->
    <path d="M28 0 H160 L224 64 V238 C224 256 210 270 192 270 H28 C10 270 0 256 0 238 V32 C0 14 10 0 28 0 Z"
          fill="#111827" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <!-- Fold -->
    <path d="M160 0 V42 C160 54 170 64 182 64 H224 Z" fill="#F59E0B"/>
    <path d="M160 0 V42 C160 54 170 64 182 64 H224" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>

    <!-- Split / merge motif -->
    <rect x="44" y="92" width="56" height="112" rx="14" fill="#173D3A"/>
    <rect x="124" y="92" width="56" height="112" rx="14" fill="#173D3A"/>
    <path d="M112 82 V216" stroke="#14B8A6" stroke-width="14" stroke-linecap="round"/>
    <path d="M70 148 H95 M129 148 H154" stroke="#14B8A6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="112" cy="236" r="10" fill="#F59E0B"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(360 112)">
    <text x="0" y="78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="112" font-weight="750" letter-spacing="-5">
      <tspan fill="#FFFFFF">pixo</tspan><tspan fill="#14B8A6">PDF</tspan>
    </text>
    <rect x="8" y="112" width="548" height="10" rx="5" fill="#334155"/>
    <rect x="8" y="112" width="206" height="10" rx="5" fill="#F59E0B"/>
    <text x="8" y="164" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" fill="#CBD5E1" letter-spacing="1.6">
      ORGANIZE • TRANSFORM • PROTECT
    </text>
  </g>
</svg>
