[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pixopdf"
version = "0.1.0"
description = "A private, local and cross-platform PDF toolbox"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{name = "PixoGlace"}]
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6>=6.7",
    "pikepdf>=9",
    "pypdfium2>=4.30",
    "Pillow>=10",
    "packaging>=24",
]

[project.optional-dependencies]
signatures = ["pyHanko>=0.25"]
ocr = ["ocrmypdf>=16"]

[project.scripts]
pixopdf = "pixopdf.__main__:main"

[tool.poetry]
packages = [{include = "pixopdf", from = "src"}]
include = [
    {path = "assets/README.md", format = ["sdist", "wheel"]},
    {path = "assets/logo_dark.png", format = ["sdist", "wheel"]},
    {path = "assets/logo_white.png", format = ["sdist", "wheel"]},
    {path = "assets/pixopdf-brand-board.svg", format = ["sdist", "wheel"]},
    {path = "assets/pixopdf-logo-dark.svg", format = ["sdist", "wheel"]},
    {path = "assets/pixopdf-logo-light.svg", format = ["sdist", "wheel"]},
    {path = "assets/pixopdf-vector-assets", format = ["sdist", "wheel"]},
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
ruff = ">=0.6"
mypy = ">=1.11"

[tool.poetry.group.build.dependencies]
pyinstaller = ">=6.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pixopdf"]
