name: PixoPDF CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixopdf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.1"
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  quality:
    name: Quality and coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Poetry
        run: |
          python -m pip install "poetry==${{ env.POETRY_VERSION }}"
          poetry --version

      - name: Install locked dependencies
        run: |
          poetry check --lock
          poetry install --with dev

      - name: Run static analysis
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy src

      - name: Run test suite with coverage
        run: |
          poetry run python -m compileall -q src tests
          poetry run pytest --cov=pixopdf --cov-report=term-missing --cov-fail-under=80
          poetry run python -c "import pixopdf"

  portability:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          python -m pip install "poetry==${{ env.POETRY_VERSION }}"
          poetry --version

      - name: Install locked dependencies
        run: |
          poetry check --lock
          poetry install --with dev

      - name: Run platform tests
        run: |
          poetry run python -m compileall -q src tests
          poetry run pytest -q
          poetry run python -c "import pixopdf"
