name: Reusable PixoPDF binary build

on:
  workflow_call:
    inputs:
      artifact_prefix:
        description: Prefix used for uploaded artifact names
        type: string
        default: PixoPDF-build
      retention_days:
        description: Number of days to retain uploaded artifacts
        type: number
        default: 14
      source_ref:
        description: Git ref containing the PixoPDF sources to build
        type: string
        default: ""

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.1"
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Poetry
        run: |
          python -m pip install "poetry==${{ env.POETRY_VERSION }}"
          poetry --version

      - name: Install locked dependencies
        run: |
          poetry check --lock
          poetry install --with dev,build

      - name: Run Linux tests
        run: |
          poetry run python -m compileall -q src tests
          poetry run pytest -q

      - name: Generate packaging assets and build Linux executable
        run: |
          poetry run python packaging/create_packaging_art.py
          poetry run pyinstaller --clean --noconfirm pixopdf.spec

      - name: Verify and package Linux portable archive and Debian installer
        shell: bash
        run: |
          test -x dist/PixoPDF
          file dist/PixoPDF
          version="$(poetry run python -c 'from pixopdf.config import VERSION; print(VERSION)')"
          portable_root="release/PixoPDF-linux-x86_64-portable"
          deb_root="release/deb-root"
          mkdir -p "$portable_root" \
            "$deb_root/DEBIAN" \
            "$deb_root/opt/PixoPDF" \
            "$deb_root/usr/bin" \
            "$deb_root/usr/share/applications" \
            "$deb_root/usr/share/icons/hicolor/256x256/apps" \
            "$deb_root/usr/share/metainfo"
          install -m 755 dist/PixoPDF "$portable_root/PixoPDF"
          install -m 644 packaging/linux/pixopdf.desktop "$portable_root/pixopdf.desktop"
          install -m 644 assets/PixoPDF.png "$portable_root/pixopdf.png"
          install -m 644 LICENSE "$portable_root/LICENSE"
          tar -C release -czf release/PixoPDF-linux-x86_64-portable.tar.gz \
            PixoPDF-linux-x86_64-portable
          tar -tzf release/PixoPDF-linux-x86_64-portable.tar.gz

          install -m 755 dist/PixoPDF "$deb_root/opt/PixoPDF/PixoPDF"
          ln -s /opt/PixoPDF/PixoPDF "$deb_root/usr/bin/PixoPDF"
          install -m 644 packaging/linux/pixopdf.desktop \
            "$deb_root/usr/share/applications/pixopdf.desktop"
          install -m 644 assets/PixoPDF.png \
            "$deb_root/usr/share/icons/hicolor/256x256/apps/pixopdf.png"
          install -m 644 packaging/linux/io.github.pixoglace.pixopdf.metainfo.xml \
            "$deb_root/usr/share/metainfo/io.github.pixoglace.pixopdf.metainfo.xml"
          printf '%s\n' \
            'Package: pixopdf' \
            "Version: $version" \
            'Section: utils' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: PixoGlace' \
            'Homepage: https://github.com/PixoGlace/pixopdf' \
            'Description: Organize, transform and protect PDF documents locally' \
            > "$deb_root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$deb_root" \
            "release/pixopdf_${version}_amd64.deb"
          dpkg-deb --info "release/pixopdf_${version}_amd64.deb"
          dpkg-deb --contents "release/pixopdf_${version}_amd64.deb"

      - name: Upload Linux portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-linux-x86_64-portable
          path: release/PixoPDF-linux-x86_64-portable.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0

      - name: Upload Linux installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-linux-amd64-installer
          path: release/pixopdf_*_amd64.deb
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0

  windows:
    name: Windows x86_64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          python -m pip install "poetry==${{ env.POETRY_VERSION }}"
          poetry --version

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Install locked dependencies
        run: |
          poetry check --lock
          poetry install --with dev,build

      - name: Run Windows tests
        run: |
          poetry run python -m compileall -q src tests
          poetry run pytest -q

      - name: Generate packaging assets and build Windows application
        run: |
          poetry run python packaging/create_packaging_art.py
          poetry run pyinstaller --clean --noconfirm pixopdf.spec

      - name: Verify and package Windows portable archive and installer
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/PixoPDF/PixoPDF.exe" -PathType Leaf)) {
              throw "PyInstaller did not produce dist/PixoPDF/PixoPDF.exe"
          }
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Compress-Archive -Path "dist/PixoPDF" `
              -DestinationPath "release/PixoPDF-windows-x86_64-portable.zip" -Force
          $verificationPath = Join-Path $env:RUNNER_TEMP "pixopdf-windows-archive"
          Expand-Archive -LiteralPath "release/PixoPDF-windows-x86_64-portable.zip" `
              -DestinationPath $verificationPath -Force
          if (-not (Test-Path -LiteralPath "$verificationPath/PixoPDF/PixoPDF.exe" -PathType Leaf)) {
              throw "The Windows archive does not contain PixoPDF.exe"
          }
          $env:PIXO_APP_NAME = "PixoPDF"
          $env:PIXO_APP_VERSION = poetry run python -c "from pixopdf.config import VERSION; print(VERSION)"
          $env:PIXO_SOURCE_DIR = "$PWD\dist\PixoPDF"
          $env:PIXO_OUTPUT_DIR = "$PWD\release"
          $env:PIXO_ROOT_DIR = "$PWD"
          $env:PIXO_WIZARD_IMAGE = "$PWD\build\packaging\windows-wizard.bmp"
          $env:PIXO_WIZARD_SMALL_IMAGE = "$PWD\build\packaging\windows-small.bmp"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
              "packaging\windows\PixoPDF.iss"
          if (-not (Test-Path -LiteralPath "release/PixoPDF-windows-x86_64-setup.exe" -PathType Leaf)) {
              throw "Inno Setup did not produce the Windows installer"
          }

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-windows-x86_64-portable
          path: release/PixoPDF-windows-x86_64-portable.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-windows-x86_64-installer
          path: release/PixoPDF-windows-x86_64-setup.exe
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Verify runner architecture
        shell: bash
        run: |
          actual_arch="$(uname -m)"
          test "$actual_arch" = "${{ matrix.arch }}"
          echo "Building for $actual_arch"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          python -m pip install "poetry==${{ env.POETRY_VERSION }}"
          poetry --version

      - name: Install DMG tooling
        run: brew install create-dmg

      - name: Install locked dependencies
        run: |
          poetry check --lock
          poetry install --with dev,build

      - name: Run macOS tests
        run: |
          poetry run python -m compileall -q src tests
          poetry run pytest -q

      - name: Generate packaging assets and build macOS application
        run: |
          poetry run python packaging/create_packaging_art.py
          poetry run pyinstaller --clean --noconfirm pixopdf.spec

      - name: Verify, sign and package macOS application
        shell: bash
        run: |
          app="dist/PixoPDF.app"
          plist="$app/Contents/Info.plist"
          executable="$app/Contents/MacOS/PixoPDF"
          version="$(poetry run python -c 'from pixopdf.config import VERSION; print(VERSION)')"
          test -d "$app"
          test -x "$executable"
          file "$executable" | grep -q "${{ matrix.arch }}"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" \
              = "com.pixoglace.pixopdf"
          test "$(plutil -extract CFBundleDisplayName raw -o - "$plist")" = "PixoPDF"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$version"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p release
          archive="release/PixoPDF-macos-${{ matrix.arch }}-portable.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          unzip -t "$archive"
          rm -rf build/dmg-stage
          mkdir -p build/dmg-stage
          cp -R "$app" build/dmg-stage/PixoPDF.app
          create-dmg \
            --volname "PixoPDF" \
            --volicon "assets/PixoPDF.icns" \
            --background "assets/dmg/pixopdf-dmg-background.png" \
            --window-pos 200 120 \
            --window-size 660 420 \
            --text-size 13 \
            --icon-size 112 \
            --icon "PixoPDF.app" 128 255 \
            --hide-extension "PixoPDF.app" \
            --app-drop-link 515 255 \
            --hdiutil-quiet \
            --no-internet-enable \
            "release/PixoPDF-macos-${{ matrix.arch }}.dmg" \
            "build/dmg-stage"
          hdiutil verify "release/PixoPDF-macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-macos-${{ matrix.arch }}-portable
          path: release/PixoPDF-macos-${{ matrix.arch }}-portable.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-macos-${{ matrix.arch }}-installer
          path: release/PixoPDF-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0
