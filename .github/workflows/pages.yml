name: PixoPDF showcase website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/unit/test_docs_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixopdf-github-pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.1"
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  prepare:
    name: Validate and package website
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: python -m pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Install website test dependencies
        run: poetry install --only dev --no-root

      - name: Validate static website
        run: poetry run pytest tests/unit/test_docs_site.py -q

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Deploy website
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
