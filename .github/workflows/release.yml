name: Build and release PixoPDF
run-name: PixoPDF release · ${{ inputs.release_tag || github.ref_name }} · ${{ github.actor }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing PixoPDF tag to build and publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pixopdf-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.release_metadata.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compare project, application and tag versions
        id: release_metadata
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          release_tag="$REQUESTED_RELEASE_TAG"
          project_version="$(python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          application_version="$(PYTHONPATH=src python -c \
              'from pixopdf.config import VERSION; print(VERSION)')"
          test "$project_version" = "$application_version"
          test "$release_tag" = "v$project_version"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Validated PixoPDF $project_version"

  binaries:
    name: Build release binaries
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      artifact_prefix: PixoPDF-release
      retention_days: 14
      source_ref: ${{ needs.validate.outputs.release_tag }}

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [validate, binaries]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: PixoPDF-release-*
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          expected_assets=(
            PixoPDF-linux-x86_64.tar.gz
            PixoPDF-windows-x86_64.exe
            PixoPDF-windows-x86_64.zip
            PixoPDF-macos-arm64.zip
            PixoPDF-macos-x86_64.zip
          )
          for asset in "${expected_assets[@]}"; do
            test -s "release-assets/$asset"
          done
          (
            cd release-assets
            sha256sum PixoPDF-* > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Publish or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            prerelease_args=()
            if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc) ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "PixoPDF $RELEASE_TAG" \
              "${prerelease_args[@]}"
          fi
